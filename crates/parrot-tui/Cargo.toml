[package]
name = "parrot-tui"
description = "Labelled terminal trees, profiles, locators, waits and actions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "parrot-term-tool"
path = "src/bin/parrot-term-tool/main.rs"
test = false

[dependencies]
parrot-term.workspace = true
regex.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
thiserror.workspace = true
unicode-width = "0.2"
rustix = { version = "1", features = ["process", "termios", "stdio"] }
