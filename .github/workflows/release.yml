name: Release
on:
  push:
    tags: ["v*"]
  # A dry run builds and packs everything, and publishes nothing. It checks the workflow itself
  # before a tag; the eggs artifact holds the registry it would have published.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: 1.99.0
  # The name of the secret that holds the registry's Ed25519 signing key. Signing takes the
  # variable's name, never the key on a command line.
  SIGN_KEY_ENV: PARROT_EGG_SIGNING_KEY
jobs:
  # One `parrot` per OS and architecture, with a checksum beside each archive, and the driver
  # binaries the eggs ship as Hatchery variants.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: Install the aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" --bin parrot \
            --bin parrot-driver-claude --bin parrot-driver-codex --bin parrot-driver-pi \
            --bin parrot-driver-opencode --bin parrot-driver-t3
      - name: Package
        shell: bash
        run: |
          name="parrot-${{ matrix.target }}"
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/parrot.exe" ]; then
            bin="target/${{ matrix.target }}/release/parrot.exe"
          else
            bin="target/${{ matrix.target }}/release/parrot"
          fi
          tar -czf "dist/$name.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          cd dist
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: parrot-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Collect the driver binaries
        shell: bash
        run: |
          mkdir -p drivers
          for d in claude codex pi opencode t3; do
            cp target/${{ matrix.target }}/release/parrot-driver-$d* drivers/ 2>/dev/null || true
          done
          rm -f drivers/*.d drivers/*.pdb
          ls drivers
      - uses: actions/upload-artifact@v4
        with:
          name: drivers-${{ matrix.target }}
          path: drivers/*
          if-no-files-found: error

  # Packs each egg with every platform's driver binary as a variant and publishes a static
  # Hatchery registry: as release assets, and on GitHub Pages at the default registry URL,
  # https://aiviarium.github.io/parrot/eggs. The registry is signed only when the signing-key
  # secret is set. A dry run stops before the two upload steps that publish.
  eggs:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: drivers-*
          path: drivers
      - uses: actions/download-artifact@v4
        with:
          name: parrot-x86_64-unknown-linux-gnu
          path: parrot
      - name: Put the binaries in their variant folders
        run: |
          for t in x86_64-unknown-linux-gnu:linux-x86_64 aarch64-unknown-linux-gnu:linux-aarch64 \
                   aarch64-apple-darwin:macos-aarch64 x86_64-pc-windows-msvc:windows-x86_64; do
            triple="${t%%:*}"; key="${t##*:}"
            for d in claude codex pi opencode t3; do
              dest="eggs/$d/parrot/variants/$key"
              mkdir -p "$dest"
              cp drivers/drivers-$triple/parrot-driver-$d* "$dest/"
              chmod +x "$dest"/*
            done
          done
      - name: Pack and publish the registry
        env:
          # Without the secret the registry is published unsigned, as it is served from this
          # repository's own GitHub Pages.
          PARROT_EGG_SIGNING_KEY: ${{ secrets.PARROT_EGG_SIGNING_KEY }}
        run: |
          tar -xzf parrot/parrot-x86_64-unknown-linux-gnu.tar.gz -C parrot
          mkdir -p pages
          args=(eggs pack eggs --publish pages/eggs)
          if [ -n "$PARROT_EGG_SIGNING_KEY" ]; then
            args+=(--sign-key-env "$SIGN_KEY_ENV")
          fi
          ./parrot/parrot "${args[@]}" | tee pack.log
          grep '^public key ' pack.log | sed 's/^public key //' > pages/eggs/key.txt || true
          if [ -s pages/eggs/key.txt ]; then
            key="$(cat pages/eggs/key.txt)"
            echo "The registry is signed with \`$key\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Give it to Hatchery as key=\"$key\" to check an egg against it." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p dist
          tar -czf dist/parrot-eggs-registry.tar.gz -C pages eggs
          find pages/eggs -name '*.egg' -exec cp {} dist/ \;
          (cd dist && sha256sum parrot-eggs-registry.tar.gz > parrot-eggs-registry.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: eggs
          path: dist/*
          if-no-files-found: error
      # The docs site and the egg registry share one Pages site, so a release
      # publishes both: the docs at the root, the registry under /eggs.
      - id: pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the docs site with the registry
        if: github.event_name == 'push'
        working-directory: site
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p out/eggs
          cp -r ../pages/eggs/. out/eggs/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site/out
      - uses: actions/deploy-pages@v5
        if: github.event_name == 'push'

  publish:
    if: github.event_name == 'push'
    needs: [build, eggs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parrot-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: eggs
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
