# Codex CLI, written against the recordings of 0.167.1 in crates/parrot-tui/fixtures/casts.
#
# Codex lives on the alternate screen and wraps every frame in a synchronized update. Its
# prompt is a row starting with `›` on a background fill, holding the cursor; the model line
# and key hints are below it. While it works a line `• Working (3s • esc to interrupt)` sits
# above the prompt and the window title starts with a braille spinner. Dialogs are drawn on a
# background fill or plainly, with numbered options and `›` on the selection.

[profile]
id = "codex"
name = "Codex CLI"
match = { command = "codex", version = ">=0.160" }
version-from-screen = 'OpenAI Codex \(v(\d+\.\d+\.\d+)\)'
unrecognised-after = "10s"

# ---- nodes ----

[[node]]
tag = "prompt"
where = { role = "input", starts-with = "›" }
last = true

# `• Working (3s • esc to interrupt)`, also `• Running …` lines with a timer.
[[node]]
tag = "spinner"
where = { role = ["progress", "hint"], busy = true, above = "prompt" }

# A prompt the user sent, repeated in the transcript.
[[node]]
tag = "user-message"
where = { role = ["text", "heading"], starts-with = "›", above = "prompt" }

# The update notice shown before anything else: `Update available · 0.167.1 → 0.169.0` with
# `1. Update now` / `2. Skip` / `3. Skip until next version`.
[[node]]
tag = "update-dialog"
role = "dialog"
where = { role = "dialog", text-matches = 'Update available', has = { role = "menu" } }
first = true

# Folder trust: `Trust this folder?` ... `1. Trust and continue`.
[[node]]
tag = "trust-dialog"
role = "dialog"
lines = { from = '^\s*Folder access|Trust this folder\?', to = 'enter continue' }

[[node]]
tag = "trust-dialog"
name = "trust-dialog-auto"
where = { role = "dialog", text-matches = 'Trust this folder\?', not = { tag = "trust-dialog" } }
first = true

# Command and patch approvals: `Would you like to run the following command?` ... options ...
# `Press enter to confirm or esc to cancel`.
[[node]]
tag = "approval"
role = "dialog"
where = { role = "dialog", text-matches = 'Would you like to (run|make|apply|allow|grant)', has = { role = "menu" } }
first = true

[[node]]
tag = "approval"
name = "approval-lines"
role = "dialog"
lines = { from = 'Would you like to (run|make|apply|allow|grant)', to = 'Press enter to confirm' }

# The model and reasoning pickers.
[[node]]
tag = "model-picker"
role = "dialog"
lines = { from = '^\s*Select (Model and Effort|Reasoning Level)', to = '(enter select|enter default|esc back)' }

# The slash-command popup between the transcript and the prompt.
[[node]]
tag = "slash-menu"
where = { role = "menu", text-matches = '(?m)^\s*(›\s*)?/[a-z]' }

# The options of whichever dialog is open.
[[node]]
tag = "choices"
where = { role = "menu", not = { tag = "slash-menu" } }
first = true

# ---- states, first match wins ----

[[state]]
name = "onboarding"
when = { any = [{ exists = "update-dialog" }, { exists = "trust-dialog" }] }

[[state]]
name = "awaiting-approval"
when = { any = [{ exists = "approval" }, { title-matches = 'Action Required' }] }

[[state]]
name = "awaiting-input"
when = { any = [{ exists = "model-picker" }, { find = { role = "dialog", has = { role = "menu" } }, not-exists = "prompt" }] }

# The working line is replaced by the answer while it streams; the title's braille spinner
# keeps turning then. It also turns while Codex starts up, so it only counts once a prompt
# has been sent.
[[state]]
name = "working"
when = { any = [{ exists = "spinner" }, { title-matches = '^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]', exists = "user-message" }] }

# The animated logo with `loading` under the version, drawn above a prompt that is not ready.
[[state]]
name = "starting"
when = { any-text-matches = '(?m)^\s+loading\s*$' }

[[state]]
name = "idle"
when = { exists = "prompt" }

[[state]]
name = "starting"
when = { until-seen = "idle" }

# ---- actions ----

[[action]]
name = "submit"
require = { state = "idle", hold = "300ms" }
steps = [
  { paste = "$text" },
  { wait = { text-in = "prompt", contains = "$text" }, timeout = "5s" },
  { key = "enter" },
]
expect = { any = [{ state = ["working", "awaiting-approval", "awaiting-input"] }, { empty = "prompt" }], within = "15s" }

# Codex takes every prompt as a paste; several lines are the same action under the name the driver uses.
[[action]]
name = "submit-paste"
require = { state = "idle", hold = "300ms" }
steps = [
  { paste = "$text" },
  { wait = { not = { empty = "prompt" } }, timeout = "5s" },
  { key = "enter" },
]
expect = { any = [{ state = ["working", "awaiting-approval", "awaiting-input"] }, { empty = "prompt" }], within = "15s" }

[[action]]
name = "approve"
description = "Run the command once (the first option)."
require = { state = "awaiting-approval", hold = "300ms" }
steps = [{ select = { in = "choices", index = 0 } }, { key = "enter" }]
expect = { not = ["awaiting-approval"], within = "5s" }

[[action]]
name = "deny"
description = "Decline and tell Codex to stop (Esc)."
require = { state = "awaiting-approval", hold = "300ms" }
steps = [{ key = "esc" }]
expect = { not = ["awaiting-approval"], within = "5s" }

[[action]]
name = "interrupt"
require = { state = "working", hold = "300ms" }
steps = [{ key = "esc" }]
expect = { not = ["working"], within = "5s" }

[[action]]
name = "choose"
require = { state = ["awaiting-input", "awaiting-approval", "onboarding"], hold = "300ms" }
steps = [{ select = { in = "choices", option = "$option" } }, { key = "enter" }]
expect = { changed = "choices", within = "5s" }

[[action]]
name = "skip-update"
require = { state = "onboarding", exists = "update-dialog", hold = "1s" }
steps = [{ key = "esc" }]
expect = { not-exists = "update-dialog", within = "5s" }

[[action]]
name = "trust"
require = { state = "onboarding", exists = "trust-dialog", hold = "1s" }
steps = [{ select = { in = "choices", label = "Trust" } }, { key = "enter" }]
expect = { not-exists = "trust-dialog", within = "10s" }

[[action]]
name = "open-model-picker"
require = { state = "idle", empty = "prompt", hold = "300ms" }
steps = [
  { type = "/model" },
  { wait = { text-in = "prompt", contains = "/model" }, timeout = "5s" },
  { key = "enter" },
]
expect = { exists = "model-picker", within = "5s" }

[[action]]
name = "close-dialog"
require = { state = ["awaiting-input", "awaiting-approval"], hold = "300ms" }
steps = [{ key = "esc" }]
expect = { not = ["awaiting-input"], within = "5s" }

[[action]]
name = "quit"
require = { state = "idle", empty = "prompt", hold = "300ms" }
steps = [{ key = "ctrl+c" }]
expect = { not-exists = "prompt", within = "10s" }

[[action]]
name = "clear-prompt"
description = "Delete what is typed in the prompt."
require = { state = "idle", hold = "300ms" }
steps = [{ key = "ctrl+u" }]
expect = { empty = "prompt", within = "3s" }
