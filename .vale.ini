StylesPath = .vale/styles
MinAlertLevel = suggestion

# AI tells, punctuation, filler and puffery come from these; Parrot adds asides, comma lists, sentence
# length, restating, assertions and headings. `vale sync` fetches them into .vale/styles.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, Voices

[*.md]
BasedOnStyles = Vale, ai-tells, Voices, Parrot
ai-tells = warning
ai-tells.EmDashUsage = error
ai-tells.OverusedVocabulary = error
ai-tells.PromotionalPuffery = error
Vale.Spelling = NO

# Licenses, dependencies and build output aren't ours to word.
[{**/LICENSE*,**/node_modules/**,target/**,.vale/**}]
BasedOnStyles =
