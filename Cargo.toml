[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aiviarium/parrot"

[workspace.dependencies]
parrot-term = { path = "crates/parrot-term" }
parrot-tui = { path = "crates/parrot-tui" }
parrot-models = { path = "crates/parrot-models" }
parrot-proto = { path = "crates/parrot-proto" }
parrot-core = { path = "crates/parrot-core" }
parrot-store = { path = "crates/parrot-store" }
parrot-serve = { path = "crates/parrot-serve" }
parrot-guard = { path = "crates/parrot-guard" }
parrot-driver = { path = "crates/parrot-driver" }
parrot-driver-claude = { path = "crates/parrot-driver-claude" }
parrot-driver-codex = { path = "crates/parrot-driver-codex" }
parrot-driver-tui = { path = "crates/parrot-driver-tui" }
parrot-driver-acp = { path = "crates/parrot-driver-acp" }
parrot-driver-pi = { path = "crates/parrot-driver-pi" }
parrot-driver-opencode = { path = "crates/parrot-driver-opencode" }
parrot-driver-t3 = { path = "crates/parrot-driver-t3" }
parrot-eggs = { path = "crates/parrot-eggs" }
parrot-workspace = { path = "crates/parrot-workspace" }
parrot-mcp = { path = "crates/parrot-mcp" }
parrot-link = { path = "crates/parrot-link" }
parrot-conform = { path = "crates/parrot-conform" }
hatchery = { git = "https://github.com/aiviarium/hatchery", rev = "cfb6e540f3c6234c112a250ed4e0ce3badcafeea" }
semver = "1"
kdl = { version = "6.7", default-features = false, features = ["span"] }
schemars = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
snow = "0.10"
proptest = "1"
tempfile = "3"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.28"
rand = "0.9"
bytes = "1.12.1"
futures = "0.3.34"
libc = "0.2"
jsonschema = { version = "0.61.2", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt", "io"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rustix = { version = "1", features = ["process"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading"] }

# Line numbers in backtraces, and quicker builds of the dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
